<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mask transfer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f6f6f4, #17181a);
    --panel: light-dark(#fff, #222327);
    --line: light-dark(#d9d9d4, #3a3b40);
    --muted: light-dark(#6b6b66, #9a9aa0);
    --accent: light-dark(#2459d6, #7aa2ff);
    --warn: light-dark(#a15c00, #f0b45a);
    font: 15px/1.45 system-ui, sans-serif;
  }
  body { margin: 0; background: var(--bg); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 40px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  header p { margin: 0 0 20px; color: var(--muted); }
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .inputs { grid-template-columns: 1fr; } }
  .drop {
    display: block; padding: 16px; border: 2px dashed var(--line); border-radius: 10px;
    background: var(--panel); cursor: pointer; transition: border-color .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop.done { border-style: solid; }
  .drop input { display: none; }
  .drop strong { display: block; }
  .drop span, .drop small { color: var(--muted); }
  .drop small { display: block; margin-top: 6px; overflow-wrap: anywhere; }
  .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; margin: 16px 0 8px;
    padding: 12px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  }
  .controls label { display: inline-flex; align-items: center; gap: 8px; }
  .controls fieldset { border: 0; padding: 0; margin: 0; display: inline-flex; gap: 10px; align-items: center; }
  .controls legend { float: left; margin-right: 4px; }
  output { min-width: 3.5em; font-variant-numeric: tabular-nums; }
  button {
    margin-left: auto; font: inherit; font-weight: 600; padding: 8px 18px; border: 0; border-radius: 8px;
    background: var(--accent); color: light-dark(#fff, #10131a); cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  #status { min-height: 1.4em; color: var(--muted); margin: 4px 2px; }
  #status .warn { color: var(--warn); }
  #status div { margin: 2px 0; }
  .stage {
    margin-top: 8px; overflow: auto; max-height: 78vh; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); text-align: center;
  }
  .stage:empty { display: none; }
  canvas { display: block; margin: 0 auto; max-width: 100%; max-height: calc(78vh - 2px); cursor: zoom-in; }
  .stage.zoom { text-align: left; }
  .stage.zoom canvas { max-width: none; max-height: none; cursor: zoom-out; image-rendering: pixelated; }
  .stage[data-bg="checker"] canvas { background: repeating-conic-gradient(#c8c8c8 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  .stage[data-bg="white"] canvas { background: #fff; }
  .stage[data-bg="black"] canvas { background: #000; }
  .hint { color: var(--muted); font-size: .85rem; margin: 6px 2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Mask transfer</h1>
    <p>Applies the transparency of a low-resolution cutout to the full-resolution original and saves it as a
      lossless PNG. Everything runs locally in your browser — no upload.</p>
  </header>

  <section class="inputs">
    <label class="drop" data-kind="original">
      <input type="file" accept="image/*">
      <strong>1 · Original</strong>
      <span>full resolution, e.g. JPEG</span>
      <small></small>
    </label>
    <label class="drop" data-kind="cutout">
      <input type="file" accept="image/png,image/webp,image/avif,image/*">
      <strong>2 · Cutout</strong>
      <span>low resolution, transparent background</span>
      <small></small>
    </label>
  </section>

  <form class="controls" id="controls">
    <label>Background opacity
      <input type="range" name="opacity" min="0" max="100" step="1" value="0">
      <output name="opacityOut">0 %</output>
    </label>
    <fieldset>
      <legend>Mask upscaling</legend>
      <label><input type="radio" name="resample" value="nearest" checked> Nearest</label>
      <label><input type="radio" name="resample" value="bilinear"> Bilinear</label>
    </fieldset>
    <fieldset>
      <legend>Preview on</legend>
      <label><input type="radio" name="bg" value="checker" checked> Checker</label>
      <label><input type="radio" name="bg" value="white"> White</label>
      <label><input type="radio" name="bg" value="black"> Black</label>
    </fieldset>
    <button type="button" id="download" disabled>Download PNG</button>
  </form>

  <div id="status"></div>
  <div class="stage" id="stage" data-bg="checker"></div>
  <p class="hint" id="hint" hidden>Click the preview to toggle 100 % zoom.</p>
</main>

<script type="module">
const worker = new Worker(new URL("./worker.js", import.meta.url));
const form = document.getElementById("controls");
const stage = document.getElementById("stage");
const statusEl = document.getElementById("status");
const downloadBtn = document.getElementById("download");
const canvas = document.createElement("canvas");
const view = canvas.getContext("bitmaprenderer");

const files = { original: null, cutout: null };
const info = { original: null, cutout: null };
let previewBusy = false, previewDirty = false, exporting = false;
let lastPreview = null, saved = null, errorMsg = null;

const params = () => ({ bgAlpha: form.elements.opacity.value / 100, method: form.elements.resample.value });
const send = (msg) => worker.postMessage({ ...msg, params: params() });

// ---- inputs ----
for (const drop of document.querySelectorAll(".drop")) {
  const kind = drop.dataset.kind;
  const input = drop.querySelector("input");
  input.addEventListener("change", () => input.files[0] && pick(kind, input.files[0]));
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    const f = [...e.dataTransfer.files].filter((f) => f.type.startsWith("image/"));
    if (f.length === 2) {
      // both dropped at once: the cutout is the one that is a PNG/WebP, else the smaller file
      const isCut = (x) => /png|webp|avif/.test(x.type);
      const [a, b] = isCut(f[0]) !== isCut(f[1]) ? (isCut(f[0]) ? [f[1], f[0]] : f) : f.sort((x, y) => y.size - x.size);
      pick("original", a); pick("cutout", b);
    } else if (f[0]) pick(kind, f[0]);
  });
}

function pick(kind, file) {
  files[kind] = file;
  info[kind] = null;
  saved = errorMsg = null;
  const drop = document.querySelector(`.drop[data-kind="${kind}"]`);
  drop.classList.remove("done");
  drop.querySelector("small").textContent = `${file.name} — decoding…`;
  send({ type: kind, file });
  render();
}

form.addEventListener("input", (e) => {
  form.elements.opacityOut.value = `${form.elements.opacity.value} %`;
  if (e.target.name === "bg") { stage.dataset.bg = form.elements.bg.value; return; }
  saved = null;
  if (previewBusy) previewDirty = true;
  else { previewBusy = true; send({ type: "params" }); }
  render();
});

downloadBtn.addEventListener("click", () => {
  exporting = true;
  saved = errorMsg = null;
  send({ type: "export" });
  render();
});

canvas.addEventListener("click", (e) => {
  const r = canvas.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  stage.classList.toggle("zoom");
  if (stage.classList.contains("zoom")) {
    stage.scrollLeft = fx * canvas.width - stage.clientWidth / 2;
    stage.scrollTop = fy * canvas.height - stage.clientHeight / 2;
  }
});

// ---- worker replies ----
worker.onmessage = ({ data: msg }) => {
  switch (msg.type) {
    case "loaded": {
      info[msg.which] = msg.info;
      const drop = document.querySelector(`.drop[data-kind="${msg.which}"]`);
      drop.classList.add("done");
      drop.querySelector("small").textContent = `${files[msg.which].name} — ${msg.info.w} × ${msg.info.h}`;
      break;
    }
    case "preview": {
      if (canvas.width !== msg.bitmap.width) canvas.width = msg.bitmap.width;
      if (canvas.height !== msg.bitmap.height) canvas.height = msg.bitmap.height;
      view.transferFromImageBitmap(msg.bitmap);
      if (!canvas.isConnected) stage.append(canvas);
      lastPreview = msg;
      // fall through
    }
    case "idle":
      previewBusy = false;
      if (previewDirty) { previewDirty = false; previewBusy = true; send({ type: "params" }); }
      break;
    case "progress":
      downloadBtn.textContent = `Encoding… ${Math.round(msg.value * 100)} %`;
      return;
    case "png": {
      exporting = false;
      const name = files.original.name.replace(/\.[^.]+$/, "") + "_masked.png";
      const url = URL.createObjectURL(msg.blob);
      Object.assign(document.createElement("a"), { href: url, download: name }).click();
      setTimeout(() => URL.revokeObjectURL(url), 60_000);
      saved = `Saved ${name} — ${(msg.blob.size / 1e6).toFixed(1)} MB in ${(msg.ms / 1000).toFixed(1)} s`;
      break;
    }
    case "error":
      exporting = previewBusy = false;
      errorMsg = msg.message;
      break;
  }
  render();
};
worker.onerror = (e) => { errorMsg = e.message || "Worker failed to start"; render(); };

// ---- status ----
function render() {
  const ready = info.original && info.cutout;
  downloadBtn.disabled = !ready || exporting;
  if (!exporting) downloadBtn.textContent = "Download PNG";
  document.getElementById("hint").hidden = !lastPreview;

  const lines = [];
  const add = (text, warn) => lines.push(Object.assign(document.createElement("div"),
    { textContent: text, className: warn ? "warn" : "" }));
  if (errorMsg) add(`Error: ${errorMsg}`, true);
  if (ready) {
    const { original: o, cutout: c } = info;
    add(`Mask ${c.w} × ${c.h} → ${o.w} × ${o.h} (×${(o.w / c.w).toFixed(2)}, ${form.elements.resample.value}), ` +
      `background opacity ${form.elements.opacity.value} %`);
    if (Math.abs((o.w / o.h) / (c.w / c.h) - 1) > 0.01)
      add(`Aspect ratios differ — the mask will be stretched.` +
        (Math.abs((o.w / o.h) / (c.h / c.w) - 1) < 0.01 ? " Looks like a 90° rotation mismatch." : ""), true);
  }
  for (const k of ["original", "cutout"]) for (const n of info[k]?.notes ?? []) add(n, /cannot|no transparent|Ignoring/.test(n));
  if (saved) add(saved);
  statusEl.replaceChildren(...lines);
}
</script>
</body>
</html>
